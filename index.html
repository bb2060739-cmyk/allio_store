<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALLIO | منصة إدارة صفحات الهبوط والذكاء الاصطناعي</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Cairo) -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // البلاصة فين غتحط معلومات فايربيز ديالك:
    const firebaseConfig = {

    export const db = getFirestore(app);

  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .gradient-brand { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); }
    .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_PAGES = [
      {
        id: 'lp-1',
        slug: 'cordless-vacuum-pro',
        title: 'مكنسة كهربائية لاسلكية توربو الذكية 3 في 1',
        hook: 'تخلصي من الغبار والأوساخ في دقائق بلا خيوط وبلا عذاب! التوصيل فابور اليوم فقط 🔥',
        price: 349,
        oldPrice: 550,
        productCost: 130,
        shippingCost: 35,
        adSpend: 450,
        image: 'https://images.unsplash.com/photo-1558317374-067fb5f30001?auto=format&fit=crop&w=900&q=80',
        sourceUrl: 'https://www.aliexpress.com/item/100500612345.html',
        language: 'darija',
        features: [
          'قوة شفط عالية جداً كتجمع الغبار والشعر من الزرابي والضس فدقيقة',
          'بطارية ليثيوم كتشد الشارج مزيان وكتخدم بلا كابليات',
          'خفيفة فـ اليد وساهلة فـ التنظيف بضغطة زر وحدة',
          'الدفع عند الاستلام حتى تقلب السلعة ديالك قدام الليفرور'
        ],
        reviews: [
          { name: 'سعاد المراكشية', city: 'فاس', comment: 'الصراحة واعرة بزاف، هناتني من المكنسة القديمة اللي بالكابل والشارج ديالها كيدوم!', stars: 5 },
          { name: 'ياسين العلمي', city: 'الدار البيضاء', comment: 'وصلاتني فالوقت ونفس اللون والموديل اللي فالصورة طبق الأصل، شكراً ليكم.', stars: 5 }
        ],
        stats: { views: 412, scrolled50: 280, clickedBuy: 115, abandoned: 14 }
      }
    ];

    const INITIAL_ORDERS = [
      { id: 'ORD-101', pageId: 'lp-1', fullName: 'أمين التازي', phone: '0661234567', city: 'فاس', address: 'طريق صفرو، إقامة الياسمين الشقة 8', email: 'amine@gmail.com', status: 'delivered', time: 'منذ ساعتين' }
    ];

    function App() {
      const [pages, setPages] = useState(() => {
        const saved = localStorage.getItem('allio_pages');
        return saved ? JSON.parse(saved) : INITIAL_PAGES;
      });
      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('allio_orders');
        return saved ? JSON.parse(saved) : INITIAL_ORDERS;
      });
      const [abandonedCarts, setAbandonedCarts] = useState(() => {
        const saved = localStorage.getItem('allio_abandoned');
        return saved ? JSON.parse(saved) : [
          { id: 'AB-1', pageId: 'lp-1', fullName: 'محمد', phone: '0699887766', city: 'الرباط', step: 'كتب الرقم والمدينة وخرج قبل التأكيد', time: 'منذ 15 دقيقة' }
        ];
      });
      const [radarLogs, setRadarLogs] = useState([
        { id: 1, pageTitle: 'مكنسة كهربائية لاسلكية توربو الذكية 3 في 1', action: '👀 زبون من مدينة فاس دخل لصفحة الهبوط', time: 'الآن' }
      ]);

      const [viewMode, setViewMode] = useState('admin'); 
      const [activeTab, setActiveTab] = useState('ai-builder'); 
      const [selectedPageId, setSelectedPageId] = useState(pages[0]?.id || 'lp-1');
      const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem('allio_gemini_key') || '');

      const [aiUrl, setAiUrl] = useState('');
      const [aiCustomNotes, setAiCustomNotes] = useState('');
      const [aiSalePrice, setAiSalePrice] = useState(299);
      const [aiCostPrice, setAiCostPrice] = useState(100);
      const [aiShippingCost, setAiShippingCost] = useState(35);
      const [aiLanguage, setAiLanguage] = useState('darija'); 
      const [aiCustomImage, setAiCustomImage] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [aiStepText, setAiStepText] = useState('');
      const [generatedPreview, setGeneratedPreview] = useState(null);

      const [customerForm, setCustomerForm] = useState({ fullName: '', phone: '', city: '', address: '', email: '' });
      const [orderSuccess, setOrderSuccess] = useState(false);

      useEffect(() => { localStorage.setItem('allio_pages', JSON.stringify(pages)); }, [pages]);
      useEffect(() => { localStorage.setItem('allio_orders', JSON.stringify(orders)); }, [orders]);
      useEffect(() => { localStorage.setItem('allio_abandoned', JSON.stringify(abandonedCarts)); }, [abandonedCarts]);
      useEffect(() => { localStorage.setItem('allio_gemini_key', geminiApiKey); }, [geminiApiKey]);

      const currentPage = pages.find(p => p.id === selectedPageId) || pages[0];

      const logRadarEvent = (pageId, actionText) => {
        const pageObj = pages.find(p => p.id === pageId);
        setRadarLogs(prev => [
          { id: Date.now(), pageTitle: pageObj ? pageObj.title : 'صفحة هبوط', action: actionText, time: 'الآن' },
          ...prev.slice(0, 29)
        ]);
      };

      const handleGenerateFromUrl = async (e) => {
        e.preventDefault();
        if (!aiUrl.trim() && !aiCustomNotes.trim()) {
          alert('عافاك حط الرابط ديال AliExpress أو Amazon أو كتب اسم المنتج!');
          return;
        }

        setIsGenerating(true);
        setGeneratedPreview(null);

        try {
          let scrapedContent = '';
          if (aiUrl.trim()) {
            setAiStepText('1/3 🔍 جاري الدخول للرابط وسحب معلومات المنتج والتصاور عبر Jina Reader...');
            try {
              const jinaRes = await fetch(`https://r.jina.ai/${encodeURIComponent(aiUrl.trim())}`);
              if (jinaRes.ok) {
                const rawText = await jinaRes.text();
                scrapedContent = rawText.substring(0, 4500);
              }
            } catch (err) {
              console.warn('Jina fallback to smart AI analysis');
            }
          }

          setAiStepText('2/3 🧠 الذكاء الاصطناعي ديال ALLIO كيلخص المميزات وكيكتب صفحة الهبوط بطريقة تسويقية...');

          let aiData = null;

          if (geminiApiKey.trim()) {
            const langInstruction = aiLanguage === 'darija'
              ? 'اكتب بالدارجة المغربية التسويقية المقنعة جداً (لغة الإعلانات في المغرب COD).'
              : 'اكتب باللغة العربية الفصحى التسويقية الجذابة والمقنعة.';

            const promptText = `
أنت خبير تسويق وتجارة إلكترونية (COD) في منصة ALLIO.
قم بتحويل بيانات هذا المنتج من الرابط (${aiUrl}) والملاحظات (${aiCustomNotes}) والنص المسحوب (${scrapedContent}) إلى صفحة هبوط عالية التحويل.
${langInstruction}
أرجع النتيجة بصيغة JSON فقط بدون أي نص إضافي بهذا الشكل:
{
  "title": "عنوان المنتج الجذاب",
  "hook": "جملة خطافة قوية في الأعلى تشجع على الشراء فوراً مع التوصيل المجاني",
  "features": ["ميزة 1", "ميزة 2", "ميزة 3", "ميزة 4"],
  "reviews": [
    {"name": "اسم مغربي 1", "city": "مدينة مغربية", "comment": "تعليق إيجابي مقنع", "stars": 5},
    {"name": "اسم مغربي 2", "city": "مدينة مغربية", "comment": "تعليق إيجابي مقنع", "stars": 5}
  ]
}`;

            const geminiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey.trim()}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
              })
            });

            if (geminiRes.ok) {
              const geminiJson = await geminiRes.json();
              const rawReply = geminiJson.candidates?.[0]?.content?.parts?.[0]?.text || '';
              const jsonMatch = rawReply.match(/\{[\s\S]*\}/);
              if (jsonMatch) {
                aiData = JSON.parse(jsonMatch[0]);
              }
            }
          }

          if (!aiData) {
            await new Promise(r => setTimeout(r, 1400));
            const cleanHint = aiCustomNotes.trim() || aiUrl.split('/').pop().replace(/[-_.html]/g, ' ').substring(0, 40) || 'منتج ذكي أصلي عالي الجودة';
            if (aiLanguage === 'darija') {
              aiData = {
                title: `${cleanHint} - النسخة الأصلية الاحترافية`,
                hook: `الحل النهائي اللي غيهنيك ويوفر عليك الوقت والمجهود! اطلب اليوم واستفد من تخفيض حصري + التوصيل حتى لباب الدار 🚚🔥`,
                features: [
                  'جودة عالية ومصنوع من مواد متينة كتعيش معاك مدة طويلة',
                  'سهل فـ الاستعمال وعملي بزاف فـ الدار أو الخدمة',
                  'تصميم عصري وأنيق طبق الأصل للصورة والفيديو',
                  'ضمان الجودة + الدفع عند الاستلام حتى تشوف السلعة ديالك'
                ],
                reviews: [
                  { name: 'حمزة الفاسي', city: 'فاس', comment: 'تبارك الله سلعة نقية بزاف، وصلني فـ 24 ساعة ونفس الموديل اللي فالصورة بالضبط!', stars: 5 },
                  { name: 'مريم بناني', city: 'مراكش', comment: 'جربتو هادي سيمانة وصدقات واعرة بزاف، كنصح بيها أي واحد كيتردد.', stars: 5 }
                ]
              };
            } else {
              aiData = {
                title: `${cleanHint} - الإصدار الاحترافي الأصلي`,
                hook: `احصل على أفضل تجربة وأداء فائق مع ضمان الجودة الشامل! عرض حصري لفترة محدودة مع الدفع عند الاستلام 🚚✨`,
                features: [
                  'تصميم هندسي متطور يضمن لك أعلى كفاءة وأداء يومي ممتاز',
                  'خامات أصلية مقاومة للاستخدام المكثف وتدوم طويلاً',
                  'سهل الاستخدام والتنظيف ومناسب لجميع أفراد العائلة',
                  'الدفع بأمان عند الاستلام بعد معاينة المنتج'
                ],
                reviews: [
                  { name: 'عمر المنصوري', city: 'الرباط', comment: 'منتج ممتاز جداً ومطابق للمواصفات المذكورة، التوصيل كان سريعاً والتعامل راقي.', stars: 5 },
                  { name: 'نهيلة العلوي', city: 'طنجة', comment: 'جودة رائعة تستحق الثمن، شكراً لمتجر ALLIO على المصداقية.', stars: 5 }
                ]
              };
            }
          }

          setAiStepText('3/3 🎨 جاري تصميم صفحة الهبوط وربطها مع الفورم والحاسبة المالية...');
          await new Promise(r => setTimeout(r, 700));

          const newPageObj = {
            id: 'lp-' + Date.now(),
            slug: 'product-' + Math.floor(Math.random() * 9000 + 1000),
            title: aiData.title,
            hook: aiData.hook,
            price: Number(aiSalePrice) || 299,
            oldPrice: Math.round((Number(aiSalePrice) || 299) * 1.45),
            productCost: Number(aiCostPrice) || 100,
            shippingCost: Number(aiShippingCost) || 35,
            adSpend: 0,
            image: aiCustomImage.trim() || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80',
            sourceUrl: aiUrl.trim() || 'Direct AI Generation',
            language: aiLanguage,
            features: aiData.features,
            reviews: aiData.reviews,
            stats: { views: 1, scrolled50: 0, clickedBuy: 0, abandoned: 0 }
          };

          setGeneratedPreview(newPageObj);
        } catch (error) {
          alert('وقع خطأ بسيط فـ التوليد، عاود جرب!');
        } finally {
          setIsGenerating(false);
          setAiStepText('');
        }
      };

      const publishGeneratedPage = () => {
        if (!generatedPreview) return;
        setPages(prev => [generatedPreview, ...prev]);
        setSelectedPageId(generatedPreview.id);
        setGeneratedPreview(null);
        setAiUrl('');
        setAiCustomNotes('');
        alert('✅ مبروك! تم نشر صفحة الهبوط فـ منصة ALLIO وراها واجدة تستقبل الطلبيات!');
        setActiveTab('pages');
      };

      const exportProductCSV = (pageId) => {
        const targetPage = pages.find(p => p.id === pageId);
        const pageOrders = orders.filter(o => o.pageId === pageId);
        if (pageOrders.length === 0) {
          alert('مازال ما كاينا حتى طلبية فـ هاد المنتج باش تيليشارجيها.');
          return;
        }
        const headers = ['رقم الطلبية', 'الاسم والنسب', 'رقم الهاتف', 'المدينة', 'العنوان الكامل', 'الإيميل (اختياري)', 'الحالة', 'المنتج', 'الثمن (DH)'];
        const rows = pageOrders.map(o => [
          o.id,
          `"${o.fullName}"`,
          `"${o.phone}"`,
          `"${o.city}"`,
          `"${o.address}"`,
          `"${o.email || 'غير متوفر'}"`,
          o.status,
          `"${targetPage?.title || ''}"`,
          targetPage?.price || 0
        ]);
        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `ALLIO_Clients_${targetPage?.slug || 'product'}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleCustomerOrderSubmit = (e) => {
        e.preventDefault();
        if (!customerForm.fullName || !customerForm.phone || !customerForm.city || !customerForm.address) {
          alert('عافاك عمر المعلومات الضرورية (الاسم الكامل، رقم الهاتف، المدينة، والعنوان الكامل)!');
          return;
        }
        const newOrd = {
          id: 'ORD-' + Math.floor(100 + Math.random() * 900),
          pageId: currentPage.id,
          fullName: customerForm.fullName,
          phone: customerForm.phone,
          city: customerForm.city,
          address: customerForm.address,
          email: customerForm.email || '',
          status: 'confirmed',
          time: 'الآن'
        };
        setOrders(prev => [newOrd, ...prev]);
        setPages(prev => prev.map(p => p.id === currentPage.id ? { ...p, stats: { ...p.stats, clickedBuy: p.stats.clickedBuy + 1 } } : p));
        logRadarEvent(currentPage.id, `🎉 طلبية جديدة تسجلات! الزبون "${customerForm.fullName}" من "${customerForm.city}" شرى المنتج بـ ${currentPage.price} درهم`);
        setOrderSuccess(true);
        setCustomerForm({ fullName: '', phone: '', city: '', address: '', email: '' });
      };

      const handlePhoneBlur = () => {
        if (customerForm.phone.length >= 8 && !orderSuccess) {
          const exists = abandonedCarts.some(a => a.phone === customerForm.phone && a.pageId === currentPage.id);
          if (!exists) {
            setAbandonedCarts(prev => [{
              id: 'AB-' + Date.now(),
              pageId: currentPage.id,
              fullName: customerForm.fullName || 'زبون غير مكتمل',
              phone: customerForm.phone,
              city: customerForm.city || 'غير محددة',
              step: 'كتب الرقم والمدينة وخرج قبل التأكيد',
              time: 'الآن'
            }, ...prev]);
            logRadarEvent(currentPage.id, `⚠️ الزبون كتب رقم الهاتف (${customerForm.phone}) فـ الفورم (تم حفظه فـ السلات المتروكة)`);
          }
        }
      };

      const calculateFinancials = (page) => {
        const pageOrders = orders.filter(o => o.pageId === page.id);
        const deliveredOrders = pageOrders.filter(o => o.status === 'delivered' || o.status === 'confirmed');
        const count = deliveredOrders.length;
        const revenue = count * Number(page.price);
        const totalProductCost = count * Number(page.productCost);
        const totalShippingCost = count * Number(page.shippingCost);
        const totalAds = Number(page.adSpend || 0);
        const netProfit = revenue - (totalProductCost + totalShippingCost + totalAds);
        return { count, totalOrders: pageOrders.length, revenue, totalProductCost, totalShippingCost, totalAds, netProfit };
      };

      const globalStats = pages.reduce((acc, p) => {
        const f = calculateFinancials(p);
        acc.revenue += f.revenue;
        acc.netProfit += f.netProfit;
        acc.orders += f.totalOrders;
        acc.views += p.stats.views;
        return acc;
      }, { revenue: 0, netProfit: 0, orders: 0, views: 0 });

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-slate-900/95 border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl gradient-brand flex items-center justify-center shadow-lg shadow-indigo-500/30 font-black text-xl tracking-wider text-white">
                A
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-black text-xl tracking-widest text-white">ALLIO</span>
                  <span className="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-semibold">
                    AI Multi-Store OS
                  </span>
                </div>
                <p className="text-xs text-slate-400">نظام إدارة صفحات الهبوط، استيراد المنتجات بالـ AI، والحاسبة المالية</p>
              </div>
            </div>

            <div className="flex items-center gap-2 bg-slate-800/90 p-1.5 rounded-xl border border-slate-700">
              <button
                onClick={() => { setViewMode('admin'); setOrderSuccess(false); }}
                className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${
                  viewMode === 'admin' ? 'gradient-brand text-white shadow-md' : 'text-slate-300 hover:text-white'
                }`}
              >
                🛠️ لوحة تحكم ALLIO
              </button>
              <button
                onClick={() => {
                  setViewMode('live-store');
                  setOrderSuccess(false);
                  setPages(prev => prev.map(p => p.id === currentPage.id ? { ...p, stats: { ...p.stats, views: p.stats.views + 1 } } : p));
                  logRadarEvent(currentPage.id, '👀 زبون جديد دخل يعاين صفحة الهبوط مباشرة');
                }}
                className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${
                  viewMode === 'live-store' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:text-white'
                }`}
              >
                🌐 معاينة صفحة الهبوط (كزبون حي)
              </button>
            </div>
          </header>

          {viewMode === 'admin' ? (
            <div className="flex-1 flex flex-col lg:flex-row">
              <aside className="w-full lg:w-64 bg-slate-900/60 border-b lg:border-b-0 lg:border-l border-slate-800 p-4 flex lg:flex-col gap-2 overflow-x-auto">
                {[
                  { id: 'ai-builder', label: '🤖 استيراد وتوليد بـ AI', badge: 'جديد' },
                  { id: 'overview', label: '📊 النظرة العامة' },
                  { id: 'pages', label: '🚀 صفحات الهبوط (' + pages.length + ')' },
                  { id: 'datasheets', label: '📁 ملفات الداتا والعملاء' },
                  { id: 'finance', label: '💰 الحاسبة المالية والربح' },

                {activeTab === 'radar' && (
                  <div className="glass-card p-6 rounded-2xl space-y-4">
                    <h2 className="text-lg font-black text-white">🕵️‍♂️ رادار ALLIO لتتبع تحركات الزوار مباشرة</h2>
                    <p className="text-xs text-slate-400">هنا كيبان لك كل زبون دخل لصفحات الهبوط ديالك، شحال هبط فـ الصفحة، وفوقاش كليكا على الشراء:</p>
                    <div className="space-y-2">
                      {radarLogs.map(log => (
                        <div key={log.id} className="bg-slate-900/80 border border-slate-800 p-3 rounded-xl flex items-center justify-between text-xs">
                          <div>
                            <span className="text-indigo-400 font-bold ml-2">[{log.pageTitle}]</span>
                            <span className="text-slate-200">{log.action}</span>
                          </div>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'settings' && (
                  <div className="glass-card p-6 rounded-2xl space-y-4 max-w-2xl">
                    <h2 className="text-lg font-black text-white">⚙️ إعدادات الذكاء الاصطناعي (Gemini API Key)</h2>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      المنصة خدامة دابا بمحرك ذكي مدمج، وإلا بغيتي تربطها مباشرة بـ <strong>Google Gemini API المجاني</strong> باش تولي تكتب ليك نصوص مخصصة بعمق أكثر من أي رابط:
                    </p>
                    <input
                      type="password"
                      value={geminiApiKey}
                      onChange={e => setGeminiApiKey(e.target.value)}
                      placeholder="AIzaSyYourGeminiApiKeyHere..."
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white"
                    />
                    <p className="text-xs text-emerald-400">✅ كيتحفظ المفتاح أوتوماتيكياً فـ المتصفح ديالك.</p>
                  </div>
                )}
              </main>
            </div>
          ) : (
            <div className="flex-1 bg-slate-100 text-slate-900 pb-20">
              <div className="bg-indigo-950 text-white px-4 py-2 text-xs flex flex-wrap items-center justify-between gap-2">
                <span>👀 راك دابا فـ وضع معاينة الزبون لصفحة: <strong>{currentPage.title}</strong></span>
                <select
                  value={selectedPageId}
                  onChange={e => { setSelectedPageId(e.target.value); setOrderSuccess(false); }}
                  className="bg-slate-900 text-white px-3 py-1 rounded border border-indigo-500 font-bold"
                >
                  {pages.map(p => (
                    <option key={p.id} value={p.id}>تبديل المعاينة لـ: {p.title}</option>
                  ))}
                </select>
              </div>

              <div className="bg-amber-400 text-slate-950 text-center py-2 px-3 font-extrabold text-sm">
                {currentPage.hook}
              </div>

              <div className="max-w-4xl mx-auto p-4 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8 mt-4 bg-white rounded-3xl shadow-xl">
                <div className="space-y-5">
                  <img
                    src={currentPage.image}
                    alt={currentPage.title}
                    onClick={() => logRadarEvent(currentPage.id, '🖼️ الزبون كليكا على صورة المنتج باش يكبرها')}
                    className="w-full h-80 object-cover rounded-2xl shadow-md border border-slate-200 cursor-pointer"
                  />
                  <h1 className="text-2xl font-black text-slate-900 leading-snug">{currentPage.title}</h1>
                  <div className="flex items-center gap-4">
                    <span className="text-3xl font-black text-emerald-600">{currentPage.price} درهم</span>
                    <span className="text-lg text-slate-400 line-through font-bold">{currentPage.oldPrice} درهم</span>
                    <span className="bg-rose-100 text-rose-700 text-xs font-black px-3 py-1 rounded-full">تخفيض خاص اليوم!</span>
                  </div>

                  <div className="space-y-2.5 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <h3 className="font-black text-sm text-slate-800">✨ علاش هاد المنتج هو أحسن اختيار ليك؟</h3>
                    {currentPage.features.map((feat, idx) => (
                      <div key={idx} className="flex items-start gap-2 text-sm text-slate-700 font-semibold">
                        <span className="text-emerald-600">✔</span>
                        <span>{feat}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-slate-50 p-6 rounded-2xl border-2 border-indigo-600 shadow-lg self-start">
                  <h2 className="text-lg font-black text-center text-slate-900 mb-1">
                    📦 عمر معلوماتك باش توصلك الطلبية حتى لباب الدار
                  </h2>
                  <p className="text-xs text-center text-emerald-700 font-bold mb-5">
                    الدفع عند الاستلام (ما تخلص حتى تشد السلعة فـ يديك)
                  </p>

                  {orderSuccess ? (
                    <div className="bg-emerald-100 border border-emerald-400 text-emerald-900 p-6 rounded-2xl text-center space-y-3">
                      <p className="text-3xl">🎉</p>
                      <h3 className="font-black text-lg">تم تسجيل الطلبية ديالك بنجاح!</h3>
                      <p className="text-xs">غادي نتصلو بيك قريباً فـ التيليفون باش نأكدو معاك العنوان. (ارجع دابا للوحة التحكم غتلقى الطلبية والربح تسجلو أوتوماتيكياً!)</p>
                      <button
                        onClick={() => setOrderSuccess(false)}
                        className="px-4 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold"
                      >
                        إرسال طلبية تجريبية أخرى
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleCustomerOrderSubmit} className="space-y-3.5">
                      <div>
                        <label className="block text-xs font-black text-slate-700 mb-1">الاسم الكامل (الاسم والنسب) <span className="text-rose-600">*</span></label>
                        <input
                          type="text"
                          required
                          value={customerForm.fullName}
                          onChange={e => setCustomerForm({ ...customerForm, fullName: e.target.value })}
                          placeholder="أدخل اسمك الكامل هنا..."
                          className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm focus:border-indigo-600 focus:outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-black text-slate-700 mb-1">رقم الهاتف <span className="text-rose-600">*</span></label>
                        <input
                          type="tel"
                          required
                          value={customerForm.phone}
                          onBlur={handlePhoneBlur}
                          onChange={e => setCustomerForm({ ...customerForm, phone: e.target.value })}
                          placeholder="06XXXXXXXX / 07XXXXXXXX"
                          className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm focus:border-indigo-600 focus:outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-black text-slate-700 mb-1">المدينة <span className="text-rose-600">*</span></label>
                        <input
                          type="text"
                          required
                          value={customerForm.city}
                          onChange={e => setCustomerForm({ ...customerForm, city: e.target.value })}
                          placeholder="مثلاً: فاس، الدار البيضاء، الرباط..."
                          className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm focus:border-indigo-600 focus:outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-black text-slate-700 mb-1">العنوان الكامل <span className="text-rose-600">*</span></label>
                        <input
                          type="text"
                          required
                          value={customerForm.address}
                          onChange={e => setCustomerForm({ ...customerForm, address: e.target.value })}
                          placeholder="الحي، الزنقة، رقم الدار أو الإقامة..."
                          className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm focus:border-indigo-600 focus:outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-1">البريد الإلكتروني (اختياري - ماشي ضروري)</label>
                        <input
                          type="email"
                          value={customerForm.email}
                          onChange={e => setCustomerForm({ ...customerForm, email: e.target.value })}
                          placeholder="example@gmail.com (اختياري)"
                          className="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:border-indigo-600 focus:outline-none"
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full py-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base shadow-lg transition-all"
                      >
                        🛒 اضغط هنا لتأكيد الطلب ({currentPage.price} درهم)
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
