<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الإدارة - ALLIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0F19; color: #FFFFFF; }
    </style>
</head>
<body>

    <div id="authScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-white/5 w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-white mb-2 tracking-tighter">ALLIO</h1>
                <p class="text-slate-400 text-sm">سجل الدخول باش تدخل لفضاء العمل ديالك</p>
            </div>
            
            <form id="loginForm" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-400 mr-1">البريد الإلكتروني</label>
                    <input type="email" id="emailInput" placeholder="nom@exemple.com" required 
                           class="w-full bg-slate-900 border border-white/5 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition-all text-white">
                </div>
                
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-400 mr-1">كلمة السر</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" required 
                           class="w-full bg-slate-900 border border-white/5 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition-all text-white">
                </div>
                
                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl py-3.5 mt-2 transition-all shadow-lg shadow-indigo-500/20 active:scale-[0.98]">
                    دخول
                </button>
            </form>
            <p id="authError" class="hidden text-rose-400 text-xs text-center mt-4 font-bold"></p>
        </div>
    </div>

    <div id="mainDashboard" class="hidden min-h-screen flex">
        
        <aside class="w-72 bg-slate-800 p-6 flex flex-col justify-between border-l border-white/5">
            <div>
                <div class="flex items-center gap-3 mb-10 px-2">
                    <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                        <i class="fa-solid fa-cube text-white"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tighter text-white">ALLIO</span>
                </div>

                <nav class="space-y-2">
                    <a href="#" class="flex items-center gap-3 px-4 py-3 bg-white/5 rounded-2xl text-white font-semibold text-sm transition-all">
                        <i class="fa-solid fa-chart-pie opacity-70"></i> لوحة التحكم
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white rounded-2xl font-medium text-sm transition-all">
                        <i class="fa-solid fa-cart-shopping opacity-70"></i> المبيعات
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white rounded-2xl font-medium text-sm transition-all">
                        <i class="fa-solid fa-users opacity-70"></i> الزبناء
                    </a>
                </nav>
            </div>

            <div class="bg-slate-900 p-5 rounded-3xl border border-white/5">
                <h3 class="text-sm font-bold text-white mb-3">خاصك مساعدة؟</h3>
                <p class="text-xs text-slate-400 mb-4">الدعم الفني موجود 24/7 باش يعاونك.</p>
                <button class="w-full bg-white/5 hover:bg-white/10 text-white font-semibold rounded-2xl py-2.5 text-xs transition-all">
                    تواصل مع الدعم
                </button>
            </div>
        </aside>

        <main class="flex-1 bg-slate-950 flex flex-col h-screen overflow-hidden">
            
            <header class="bg-slate-950 px-10 py-6 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold tracking-tighter text-white" id="userStoreTitle">مرحبا بك</h2>
                    <p class="text-slate-400 text-sm" id="userGreeting">تم الاتصال بنجاح</p>
                </div>
                <div class="flex items-center gap-4">
                    <button class="w-11 h-11 rounded-2xl bg-slate-800 border border-white/5 flex items-center justify-center text-slate-400 hover:text-white transition-all">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <button id="logoutBtn" class="bg-rose-600/10 hover:bg-rose-600 text-rose-500 hover:text-white px-5 py-2.5 rounded-2xl font-semibold text-sm transition-all shadow-lg shadow-rose-900/10">
                        خروج
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto px-10 pb-10">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-slate-800 p-8 rounded-3xl border border-white/5 shadow-xl shadow-black/20">
                        <p class="text-slate-400 text-sm font-semibold mb-2">إجمالي المبيعات (درهم)</p>
                        <h3 class="text-4xl font-black text-emerald-400 tracking-tighter" id="totalSales">0.00</h3>
                    </div>
                    <div class="bg-slate-800 p-8 rounded-3xl border border-white/5 shadow-xl shadow-black/20">
                        <p class="text-slate-400 text-sm font-semibold mb-2">عدد الطلبات</p>
                        <h3 class="text-4xl font-black text-indigo-400 tracking-tighter" id="totalOrders">0</h3>
                    </div>
                </div>

                <div class="bg-slate-800 p-8 rounded-3xl border border-white/5 mb-8">
                    <h2 class="text-lg font-bold mb-6 tracking-tighter">إضافة طلب جديد</h2>
                    <form id="orderForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        
                        <div class="md:col-span-1 space-y-1">
                            <label class="text-xs font-semibold text-slate-400 mr-1">اسم الزبون</label>
                            <input type="text" id="clientName" required 
                                   class="w-full bg-slate-900 border border-white/5 rounded-2xl px-5 py-3.5 text-sm focus:outline-none focus:border-indigo-500 transition-all">
                        </div>

                        <div class="md:col-span-1 space-y-1">
                            <label class="text-xs font-semibold text-slate-400 mr-1">اسم المنتج</label>
                            <input type="text" id="productName" required 
                                   class="w-full bg-slate-900 border border-white/5 rounded-2xl px-5 py-3.5 text-sm focus:outline-none focus:border-indigo-500 transition-all">
                        </div>

                        <div class="md:col-span-1 space-y-1">
                            <label class="text-xs font-semibold text-slate-400 mr-1">الثمن (درهم)</label>
                            <input type="number" id="productPrice" step="0.01" min="0" required 
                                   class="w-full bg-slate-900 border border-white/5 rounded-2xl px-5 py-3.5 text-sm focus:outline-none focus:border-indigo-500 transition-all">
                        </div>

                        <div class="md:col-span-1 flex items-end">
                            <button type="submit" 
                                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl py-3.5 transition-all shadow-lg shadow-indigo-500/20">
                                تسجيل الطلب
                            </button>
                        </div>
                    </form>
                </div>

                <div class="bg-slate-800 rounded-3xl border border-white/5 overflow-hidden">
                    <div class="p-8 border-b border-white/5 flex justify-between items-center">
                        <h2 class="text-lg font-bold tracking-tighter">قائمة الطلبات</h2>
                        <button id="clearDataBtn" class="bg-rose-500/10 hover:bg-rose-500 text-rose-500 hover:text-white px-4 py-2 rounded-2xl font-semibold text-xs transition-all">
                            مسح البيانات
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right border-collapse">
                            <thead>
                                <tr class="bg-white/5 text-slate-400 text-xs uppercase tracking-widest">
                                    <th class="p-5 font-semibold">الزبون</th>
                                    <th class="p-5 font-semibold">المنتج</th>
                                    <th class="p-5 font-semibold">الثمن</th>
                                    <th class="p-5 font-semibold text-center">إجراء</th>
                                </tr>
                            </thead>
                            <tbody id="ordersList" class="divide-y divide-white/5 text-sm text-white">
                                <!-- غادية تبان هنا المعلومات -->
                            </tbody>
                        </table>
                    </div>
                    <div id="emptyState" class="p-10 text-center text-slate-400 text-sm">
                        ماكاينش شي طلب دابا. ضيف أول طلب!
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // إعدادات فايربيز (خاصك تبدل المعلومات بالمعلومات ديالك من الفايربيز)
        const firebaseConfig = {
            
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDd_4X04yxoUNuGXl43U4f2w8wSEc6QmtQ",
  authDomain: "allio-769de.firebaseapp.com",
  projectId: "allio-769de",
  storageBucket: "allio-769de.firebasestorage.app",
  messagingSenderId: "538904003838",
  appId: "1:538904003838:web:aae0c0227870c44b9511af",
  measurementId: "G-T38HBBQTGB"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);};
        
        // --- محاكاة المنطق ---
        const authScreen = document.getElementById('authScreen');
        const mainDashboard = document.getElementById('mainDashboard');
        const loginForm = document.getElementById('loginForm');
        const logoutBtn = document.getElementById('logoutBtn');
        const orderForm = document.getElementById('orderForm');
        const ordersList = document.getElementById('ordersList');
        const emptyState = document.getElementById('emptyState');
        const authError = document.getElementById('authError');
        const totalSalesEl = document.getElementById('totalSales');
        const totalOrdersEl = document.getElementById('totalOrders');
        const clearDataBtn = document.getElementById('clearDataBtn');
        const userStoreTitle = document.getElementById('userStoreTitle');
        const userGreeting = document.getElementById('userGreeting');

        let orders = [];

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            if (email === "user@allio.com" && password === "123456") {
                authScreen.classList.add('hidden');
                mainDashboard.classList.remove('hidden');
                
                userStoreTitle.textContent = "متجر التجربة (مساحة المستعمل)";
                userGreeting.textContent = "مرحبا بك يا مستعمل، دير الخدمة ديالك.";
                loadOrdersFromStorage();
            } else if (email === "admin@allio.com" && password === "123456") {
                authScreen.classList.add('hidden');
                mainDashboard.classList.remove('hidden');
                
                userStoreTitle.textContent = "لوحة التحكم المركزية (الأدمين)";
                userGreeting.textContent = "راقب كاع المتاجر.";
                loadOrdersFromStorage();
            } else {
                authError.textContent = "معلومات الدخول غالطة.";
                authError.classList.remove('hidden');
            }
        });

        logoutBtn.addEventListener('click', () => {
            mainDashboard.classList.add('hidden');
            authScreen.classList.remove('hidden');
            authError.classList.add('hidden');
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
        });

        function loadOrdersFromStorage() {
            const storedOrders = localStorage.getItem('allio_demo_orders');
            if (storedOrders) {
                orders = JSON.parse(storedOrders);
                renderOrders();
            }
        }

        orderForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newOrder = {
                id: Date.now(),
                client: document.getElementById('clientName').value.trim(),
                product: document.getElementById('productName').value.trim(),
                price: parseFloat(document.getElementById('productPrice').value).toFixed(2)
            };

            orders.push(newOrder);
            localStorage.setItem('allio_demo_orders', JSON.stringify(orders));
            orderForm.reset();
            renderOrders();
        });

        window.deleteOrder = function(id) {
            orders = orders.filter(order => order.id !== id);
            localStorage.setItem('allio_demo_orders', JSON.stringify(orders));
            renderOrders();
        };

        clearDataBtn.addEventListener('click', () => {
            if (confirm("واش باغي تمسح كاع الطلبات؟")) {
                orders = [];
                localStorage.removeItem('allio_demo_orders');
                renderOrders();
            }
        });

        function renderOrders() {
            ordersList.innerHTML = '';
            
            if (orders.length === 0) {
                emptyState.classList.remove('hidden');
                totalSalesEl.textContent = "0.00";
                totalOrdersEl.textContent = "0";
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            let totalSales = 0;

            orders.forEach(order => {
                totalSales += parseFloat(order.price);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-5 font-semibold text-white">${order.client}</td>
                    <td class="p-5 text-indigo-400">${order.product}</td>
                    <td class="p-5 font-bold text-emerald-400">${parseFloat(order.price).toFixed(2)} درهم</td>
                    <td class="p-5 text-center">
                        <button onclick="deleteOrder(${order.id})" class="text-rose-400 hover:text-white transition-colors">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </td>
                `;
                ordersList.appendChild(tr);
            });

            totalSalesEl.textContent = totalSales.toFixed(2);
            totalOrdersEl.textContent = orders.length;
        }
    </script>
</body>
</html>
